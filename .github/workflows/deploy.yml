name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # Project sites live at https://<owner>.github.io/<repo>/. When a custom domain
      # (e.g. willowvalleyrv.com) is configured, base_path is empty and the site builds for "/".
      - name: Build & prerender
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          VITE_CONTACT_FORM_ENDPOINT: ${{ vars.VITE_CONTACT_FORM_ENDPOINT }}
          VITE_POOL_FORM_ENDPOINT: ${{ vars.VITE_POOL_FORM_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
